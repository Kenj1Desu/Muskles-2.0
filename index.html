<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#000000" />
  <title>Kenji Lifts</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #000000;
      color: #f8fafc;
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
    }
    .glass {
      background: rgba(14, 14, 18, 0.68);
      backdrop-filter: blur(30px) saturate(210%);
      -webkit-backdrop-filter: blur(30px) saturate(210%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: inset 0 1px 0.5px 0 rgba(255, 255, 255, 0.09), 0 12px 36px 0 rgba(0, 0, 0, 0.85);
    }
    .glass-input {
      background: rgba(8, 8, 10, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    .stepper-btn {
      transition: all 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .stepper-btn:active {
      transform: scale(0.85);
      background-color: #d2fe1a;
      color: #000000;
    }
    .ambient-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(110px);
      z-index: -1;
      opacity: 0.12;
      pointer-events: none;
    }
    .tab-pane {
      transition: opacity 0.28s cubic-bezier(0.34, 1.56, 0.64, 1), transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes overloadGlow {
      0%, 100% { box-shadow: 0 0 6px rgba(210, 254, 26, 0.25); }
      50% { box-shadow: 0 0 18px rgba(210, 254, 26, 0.55); }
    }
    .overload-glow {
      animation: overloadGlow 2.5s infinite;
    }
  </style>
</head>
<body class="pb-28 bg-black">

  <!-- AMOLED Accent Ambient Orbs -->
  <div class="ambient-orb bg-[#d2fe1a] w-64 h-64 top-6 -left-20"></div>
  <div class="ambient-orb bg-lime-600 w-80 h-80 top-1/3 -right-36"></div>

  <!-- Sticky Top Glass App Bar -->
  <header class="glass sticky top-0 z-40 px-4 py-3.5 flex justify-between items-center border-t-0 border-x-0">
    <div class="flex items-center gap-2.5">
      <!-- Neon Logo Badge -->
      <div class="w-9 h
