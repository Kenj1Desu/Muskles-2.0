    body {
      background-color: #030308;

      overflow-x: hidden;
      min-height: 100vh;

    /* Liquid Morphing Aurora Background */
    .aurora-bg {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
      background: radial-gradient(circle at 50% 20%, #0d0826 0%, #030308 75%);
    }

    .morph-blob {
      position: absolute;
      filter: blur(55px);
      opacity: 0.75;
      mix-blend-mode: screen;
      will-change: transform, border-radius;
    }
